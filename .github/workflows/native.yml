name: Native C++ core

on:
  workflow_dispatch:
  push:
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']

permissions:
  contents: read

jobs:
  core:
    concurrency:
      group: native-core-${{ github.ref }}-${{ matrix.os }}
      # A scarce ARM runner must not block checks for other platforms.
      cancel-in-progress: ${{ matrix.os != 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install ICU (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libicu-dev
      - name: Locate ICU (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list icu4c >/dev/null 2>&1 || brew install icu4c
          echo "ICU_ROOT=$(brew --prefix icu4c)" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S native -B native/build/ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake -DABC_BUILD_DIR=native/build/ci -DABC_BUILD_CONFIG=Release -P native/cmake/Build.cmake
      - name: Test
        run: cmake -DABC_TEST_DIR=native/build/ci -DABC_TEST_CONFIG=Release -P native/cmake/RunTests.cmake
      - name: Install
        run: cmake --install native/build/ci --config Release --prefix native/build/install
  sanitizers:
    concurrency:
      group: native-sanitizers-${{ github.ref }}
      # Frequent port commits must not cancel every long-running memory check.
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install ICU (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libicu-dev
      - name: Configure
        run: cmake -S native -B native/build/sanitizers -DCMAKE_BUILD_TYPE=Debug -DABC_SANITIZERS=ON
      - name: Build
        run: cmake -DABC_BUILD_DIR=native/build/sanitizers -DABC_BUILD_CONFIG=Debug -P native/cmake/Build.cmake
      - name: Test
        run: cmake -DABC_TEST_DIR=native/build/sanitizers -DABC_TEST_CONFIG=Debug -P native/cmake/RunTests.cmake
