name: Native C++ core

on:
  workflow_dispatch:
  push:
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure
        run: cmake -S native -B native/build/ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build native/build/ci --config Release --parallel
      - name: Test
        run: ctest --test-dir native/build/ci -C Release --output-on-failure
      - name: Install
        run: cmake --install native/build/ci --config Release --prefix native/build/install
  sanitizers:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure
        run: cmake -S native -B native/build/sanitizers -DCMAKE_BUILD_TYPE=Debug -DABC_SANITIZERS=ON
      - name: Build
        run: cmake --build native/build/sanitizers --parallel
      - name: Test
        run: ctest --test-dir native/build/sanitizers --output-on-failure
